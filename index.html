<style>

<script>
(function(){
var HS="28422435744f4327657d6b83c98721c58c52502243799b7c3e3615a7c71a157b",HP="b0880ec9062d11b54875900a221b3c4fff9db5b504e781a3203e89629fa0eaf1";
var $=function(i){return document.getElementById(i)};
var S=JSON.parse($('data').textContent),cat='الكل',q='',sort='new',isAdm=false,tab='apps',F=null,db=null,uid=null,art=null,assets=null,RT={};
try{isAdm=sessionStorage.getItem('adm')==='1'}catch(e){}

function url(u){u=String(u||'').trim();if(/^(https?:\/\/|uploads\/)/i.test(u))return u;if(/^[\w-]+(\.[\w-]+)+/.test(u))return 'https://'+u;return ''}
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')})}

}
function route(){
  var c=S.cfg;$('banner').innerHTML='<h1>'+esc(c.name)+'</h1><div><p>'+esc(c.sub)+'</p></div>';
  $('banner').style.backgroundImage=c.banner?'url('+c.banner+')':'';
  var so=[['tg','#2aabee','✈'],['tt','#000','♪'],['yt','#e53935','▶'],['fb','#3b5998','f']];
  $('soc').innerHTML=so.map(function(s){var u=url(c.social[s[0]]);return u?'<a href="'+esc(u)+'" target="_blank" rel="noopener" style="background:'+s[1]+'">'+s[2]+'</a>':''}).join('');

  var list=S.apps.filter(function(x){return (cat==='الكل'||(cat==='⭐ المفضلة'?fav(x.id):x.cat===cat))&&(!q||(x.name+' '+x.desc).toLowerCase().indexOf(q)>-1)});

function closeM(){clearInterval(timer);cur=null;$('modal').classList.add('hidden');$('modal').innerHTML=''}

  '<div class="info"><div>🏷 '+esc(x.cat)+'</div><div>📦 '+esc(x.size||'—')+'</div><div>🔖 '+esc(x.ver||'—')+'</div></div>'+

/* admin */
function msg(t,ok){var m=$('am');if(m){m.textContent=t;m.className='msg'+(ok?' ok':'')}}
function gh(){try{return JSON.parse(ls('gh')||'null')}catch(e){return null}}
function b64(t){return btoa(Array.from(new TextEncoder().encode(t),function(b){return String.fromCharCode(b)}).join(''))}
async function ghPut(path,content,message){
  var g=gh();if(!g||!g.repo||!g.token)throw {message:'اربط GitHub من تبويب الإعدادات أولًا'};
  var br=g.branch||'main',api='https://api.github.com/repos/'+g.repo+'/contents/'+path,H={Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json'};
  for(var t=0;t<2;t++){
    var sha,r=await fetch(api+'?ref='+br+'&t='+Date.now(),{headers:H});
    if(r.ok)sha=(await r.json()).sha;
    var w=await fetch(api,{method:'PUT',headers:H,body:JSON.stringify({message:message,content:content,branch:br,sha:sha})});
    if(w.ok)return;
    if(w.status!==409&&w.status!==422){var j={};try{j=await w.json()}catch(e){}throw {message:'GitHub '+w.status+': '+(j.message||'')}}
  }
  throw {message:'تعذّر الحفظ على GitHub، أعد المحاولة'};
}
async function save(){
  msg('جاري النشر...',1);
  try{await ghPut('data.json',b64(JSON.stringify(S,null,1)),'update data');route();msg('تم النشر ✔ (قد يحتاج الموقع دقيقة ليظهر للزوار)',1)}
  catch(e){msg((e&&e.message)||'تعذّر النشر')}
}
function toB64(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(file)})}
async function up(file){
  var name=id()+'-'+file.name.replace(/[^\w.\-]+/g,'_');
  await ghPut('uploads/'+name,await toB64(file),'upload '+name);
  return 'uploads/'+name;
}

  var T=[['apps','📱 التطبيقات'],['posts','📝 المقالات'],['ads','💰 الإعلانات'],['media','🖼 الصور'],['set','⚙ الإعدادات']];
  var h='<div class="pn"><h3>🔐 لوحة التحكم</h3><div class="stat"><div><b>'+S.apps.length+'</b>تطبيق</div><div><b>'+S.posts.length+'</b>مقال</div><div><b>'+S.gallery.length+'</b>صورة</div><div><b>'+Object.keys(S.ads).filter(function(k){return S.ads[k].on}).length+'</b>إعلان نشط</div></div></div><div class="tabs">'+T.map(function(t){return '<button class="chip'+(tab===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join('')+'<button class="chip" data-out>خروج</button></div>';
  if(tab==='apps'){
    var f=F||{shots:[]};
    h+='<div class="pn"><h3>'+(f.id?'تعديل تطبيق':'➕ إضافة تطبيق')+'</h3><div class="f"><input id="f_name" placeholder="اسم التطبيق" value="'+esc(f.name)+'"><select id="f_cat">'+catOpts(f.cat)+'</select><input id="f_ver" placeholder="الإصدار" value="'+esc(f.ver)+'"><input id="f_size" placeholder="الحجم مثل 85 MB" value="'+esc(f.size)+'"><textarea id="f_desc" rows="4" placeholder="الوصف">'+esc(f.desc)+'</textarea>'+
    '<div class="it"><span>الأيقونة '+(f.icon?'<img src="'+esc(f.icon)+'">':'')+'</span><button class="btn ol" data-up="icon">📷 من المعرض</button></div>'+
    '<div class="it"><span>لقطات الشاشة</span><button class="btn ol" data-up="shots">🖼 إضافة</button></div><div class="thumbs">'+f.shots.map(function(s,k){return '<img src="'+esc(s)+'" data-rs="'+k+'" title="اضغط للحذف">'}).join('')+'</div>'+
    '<input id="f_url" dir="ltr" placeholder="رابط التحميل https://..." value="'+esc(f.url)+'"><button class="btn ol" data-up="file">📁 رفع ملف التطبيق من الجهاز</button>'+
    '<label><input type="checkbox" id="f_feat"'+(f.feat?' checked':'')+' style="width:auto"> تطبيق مميز ⭐</label><button class="btn" data-save-app>نشر التطبيق</button></div></div>';
    h+='<div class="pn"><h3>التطبيقات ('+S.apps.length+')</h3>'+S.apps.map(function(x){return '<div class="it"><span>'+(x.icon?'<img src="'+esc(x.icon)+'"> ':'')+esc(x.name)+'</span><span><button class="btn ol" style="padding:5px 12px" data-edit="'+x.id+'">تعديل</button> <button class="btn dg" data-del="a:'+x.id+'">حذف</button></span></div>'}).join('')+'</div>';
  }
  if(tab==='posts'){
    var p=F||{};
    h+='<div class="pn"><h3>📝 مقال / شرح</h3><div class="f"><input id="p_t" placeholder="العنوان" value="'+esc(p.title)+'"><select id="p_c">'+catOpts(p.cat)+'</select><textarea id="p_b" rows="6" placeholder="نص الشرح">'+esc(p.body)+'</textarea><div class="it"><span>صورة مصغرة '+(p.img?'<img src="'+esc(p.img)+'">':'')+'</span><button class="btn ol" data-up="pimg">📷 اختيار</button></div><button class="btn" data-save-post>نشر المقال</button></div></div><div class="pn"><h3>المقالات</h3>'+S.posts.map(function(x){return '<div class="it"><span>'+esc(x.title)+'</span><button class="btn dg" data-del="p:'+x.id+'">حذف</button></div>'}).join('')+'</div>';
  }
  if(tab==='ads'){
    h+='<div class="pn"><h3>💰 الإعلانات</h3><small style="color:var(--mut)">بانر (صورة + رابط) أو الصق كود إعلان جاهز مثل AdSense في خانة الكود.</small>'+[['top','أعلى الصفحة وأثناء العد التنازلي'],['mid','وسط الصفحة وداخل التطبيق'],['bot','أسفل الصفحة']].map(function(s){var a=S.ads[s[0]]||{};return '<div class="f" style="border-top:1px solid var(--bd);padding-top:10px;margin-top:10px"><b>'+s[1]+'</b><label><input type="checkbox" data-adon="'+s[0]+'" style="width:auto"'+(a.on?' checked':'')+'> مفعّل</label><input data-adt="'+s[0]+'" placeholder="نص الإعلان" value="'+esc(a.text)+'"><input data-adl="'+s[0]+'" dir="ltr" placeholder="رابط الإعلان" value="'+esc(a.link)+'"><textarea data-adc="'+s[0]+'" dir="ltr" rows="2" placeholder="أو الصق كود إعلان جاهز (AdSense...)">'+esc(a.code)+'</textarea><div class="it"><span>'+(a.img?'<img src="'+esc(a.img)+'">':'صورة البانر')+'</span><button class="btn ol" data-up="ad:'+s[0]+'">📷 رفع</button></div></div>'}).join('')+'<button class="btn" style="margin-top:12px" data-save-ads>حفظ ونشر الإعلانات</button></div>';
  }
  if(tab==='media'){
    h+='<div class="pn"><h3>🖼 صور الموقع</h3><button class="btn" data-up="gal">رفع صور من المعرض</button><div class="thumbs" style="margin-top:10px">'+S.gallery.map(function(g,k){return '<img src="'+esc(g)+'" data-gdel="'+k+'" title="اضغط للحذف">'}).join('')+'</div><small style="color:var(--mut)">اضغط على الصورة لحذفها.</small></div>';
  }
  if(tab==='set'){
    var c=S.cfg;h+='<div class="pn"><h3>⚙ إعدادات الموقع</h3><div class="f"><input id="s_n" placeholder="اسم الموقع" value="'+esc(c.name)+'"><input id="s_s" placeholder="الشعار الفرعي" value="'+esc(c.sub)+'"><input id="s_a" placeholder="اسم الناشر" value="'+esc(c.author)+'">'+['tg','tt','yt','fb'].map(function(k){return '<input id="s_'+k+'" dir="ltr" placeholder="رابط '+{tg:'تيليجرام',tt:'تيك توك',yt:'يوتيوب',fb:'فيسبوك'}[k]+'" value="'+esc(c.social[k])+'">'}).join('')+'<input id="s_c" placeholder="التصنيفات مفصولة بفاصلة" value="'+esc(c.cats.join('،'))+'"><div class="it"><span>صورة البانر</span><button class="btn ol" data-up="banner">📷 رفع</button></div><button class="btn" data-save-set>حفظ ونشر</button></div></div>';
    var g=gh()||{};h+='<div class="pn"><h3>🔗 ربط GitHub (للنشر)</h3><div class="f"><input id="g_r" dir="ltr" placeholder="username/repo" value="'+esc(g.repo)+'"><input id="g_b" dir="ltr" placeholder="main" value="'+esc(g.branch)+'"><input id="g_t" dir="ltr" type="password" placeholder="Personal Access Token" value="'+esc(g.token)+'"><button class="btn" data-save-gh>حفظ الربط على هذا الجهاز</button></div></div>';
  }
  b.innerHTML=h+'<div class="msg" id="am"></div>';
}
function adminClick(t){
  var d=t.dataset;
  if(d.tab){grab();F=null;tab=d.tab;renderAdmin();return}
  if(d.out!==undefined){isAdm=false;try{sessionStorage.removeItem('adm')}catch(e){}renderAdmin();return}
  if(d.up){
    var k=d.up;grab();
    if(k==='icon')pick('image/*',0,function(o){F=F||{shots:[]};F.icon=o[0];renderAdmin()});
    if(k==='shots')pick('image/*',1,function(o){F=F||{shots:[]};F.shots=F.shots.concat(o);renderAdmin()});
    if(k==='file')pick('*/*',0,function(o){F=F||{shots:[]};F.url=o[0];renderAdmin()});
    if(k==='pimg'){F=F||{};F.title=$('p_t').value;F.body=$('p_b').value;F.cat=$('p_c').value;pick('image/*',0,function(o){F.img=o[0];renderAdmin()})}
    if(k==='gal')pick('image/*',1,function(o){S.gallery=S.gallery.concat(o);save()});
    if(k==='banner')pick('image/*',0,function(o){S.cfg.banner=o[0];save()});
    if(k.indexOf('ad:')===0){var s=k.slice(3);pick('image/*',0,function(o){S.ads[s]=S.ads[s]||{};S.ads[s].img=o[0];renderAdmin()})}
    return;
  }
  if(d.rs){grab();F.shots.splice(+d.rs,1);renderAdmin();return}
  if(d.gdel){S.gallery.splice(+d.gdel,1);save();return}
  if(d.edit){F=JSON.parse(JSON.stringify(S.apps.find(function(a){return a.id===d.edit})));F.shots=F.shots||[];renderAdmin();window.scrollTo(0,0);return}
  if(d.del){var p=d.del.split(':');if(!confirm('تأكيد الحذف؟'))return;if(p[0]==='a')S.apps=S.apps.filter(function(a){return a.id!==p[1]});else S.posts=S.posts.filter(function(a){return a.id!==p[1]});save();return}
  if(d.saveApp!==undefined){grab();F=F||{shots:[]};if(!F.name){msg('اكتب اسم التطبيق');return}if(F.url&&!url(F.url)){msg('رابط غير صحيح');return}F.url=url(F.url);
    if(F.id){S.apps=S.apps.map(function(a){return a.id===F.id?F:a})}else{F.id=id();F.date=Date.now();S.apps.unshift(F)}F=null;save();return}
  if(d.savePost!==undefined){var t2=$('p_t').value.trim();if(!t2){msg('اكتب العنوان');return}S.posts.unshift({id:id(),title:t2,cat:$('p_c').value,body:$('p_b').value,img:(F&&F.img)||'',date:Date.now()});F=null;save();return}
  if(d.saveAds!==undefined){document.querySelectorAll('[data-adon]').forEach(function(e){var k=e.dataset.adon;S.ads[k]=S.ads[k]||{};S.ads[k].on=e.checked});document.querySelectorAll('[data-adt]').forEach(function(e){S.ads[e.dataset.adt].text=e.value});document.querySelectorAll('[data-adl]').forEach(function(e){S.ads[e.dataset.adl].link=e.value});document.querySelectorAll('[data-adc]').forEach(function(e){S.ads[e.dataset.adc].code=e.value});save();return}
  if(d.saveGh!==undefined){ls('gh',JSON.stringify({repo:$('g_r').value.trim(),branch:$('g_b').value.trim()||'main',token:$('g_t').value.trim()}));msg('تم حفظ الربط ✔',1);return}
  if(d.saveSet!==undefined){var c=S.cfg;c.name=$('s_n').value;c.sub=$('s_s').value;c.author=$('s_a').value;['tg','tt','yt','fb'].forEach(function(k){c.social[k]=$('s_'+k).value});c.cats=$('s_c').value.split(/[,،]/).map(function(x){return x.trim()}).filter(Boolean);save()}
}

/* events */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,span,i,img,a');if(!t)return;var d=t.dataset;
  if(t.closest('#admin')){adminClick(t);return}
  if(e.target===$('modal')||d.close!==undefined){closeM();return}
  if(d.theme!==undefined){var dk=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=dk?'light':'dark';closeM();return}
  if(d.fs){var s=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--fs'))||16;document.documentElement.style.setProperty('--fs',Math.min(22,Math.max(13,s+(+d.fs)))+'px');return}
  if(d.cat){cat=d.cat;route();return}
  if(d.app){openApp(d.app);return}
  if(d.post){openPost(d.post);return}
  if(d.dl){startDl(d.dl);return}
  if(d.rate){rate(cur,+d.rate);return}
  if(d.fav){var f=(ls('fav')||'').split(',').filter(Boolean),i=f.indexOf(d.fav);if(i>-1)f.splice(i,1);else f.push(d.fav);ls('fav',f.join(','));route();if(cur)openApp(cur);return}
  if(d.share!==undefined){if(navigator.share)navigator.share({title:d.share,url:location.href}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(location.href);return}
});
document.addEventListener('change',function(e){if(e.target.id==='so'){sort=e.target.value;route()}});
$('q').addEventListener('input',async function(){
  var v=this.value.trim().replace(/\s+/g,' ');q=v.toLowerCase();
  if(v.length>=8&&v.length<=20&&await sha(v)===HS){this.value='';q='';login();return}
  route();
});
$('gear').onclick=function(){modal('<h3 style="margin-top:24px">⚙ الإعدادات</h3><div class="act"><button class="btn ol" data-theme>🌓 تبديل الوضع الداكن / الفاتح</button></div><p>حجم الخط:</p><div class="act"><button class="btn ol" data-fs="-1">A-</button><button class="btn ol" data-fs="1">A+</button></div>')};
$('menu').onclick=function(){window.scrollTo({top:0,behavior:'smooth'});$('q').focus()};
function login(){
  modal('<h3 style="margin-top:24px">🔐 تسجيل الدخول</h3><div class="f"><input id="pw" type="password" dir="ltr" inputmode="numeric" placeholder="كلمة السر" autocomplete="off"><div class="msg" id="pm"></div><button class="btn" id="pg">دخول</button></div>');
  var go=async function(){if(await sha($('pw').value)===HP){isAdm=true;try{sessionStorage.setItem('adm','1')}catch(e){}closeM();renderAdmin();$('admin').scrollIntoView()}else $('pm').textContent='كلمة السر غير صحيحة'};
  $('pg').onclick=go;$('pw').onkeydown=function(e){if(e.key==='Enter')go()};$('pw').focus();
}

/* runtime */
route();
fetch('data.json?t='+Date.now()).then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&d.apps){S=d;route()}}).catch(function(){});
})();
</script>
