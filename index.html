<style>
:root{box-sizing:border-box;--bg:#fff;--card:#fff;--tx:#161616;--mut:#6b7280;--bd:#e5e7eb;--soft:#f3f4f6;--g:linear-gradient(90deg,#9b3fc4,#e0506a);--a:#9b3fc4;--bn:linear-gradient(135deg,#c2117a,#f0308f);--top:#121214;--dng:#dc2626;--fs:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e12;--card:#17171d;--tx:#f1f1f4;--mut:#a0a3b1;--bd:#2a2a33;--soft:#22222b}}
:root[data-theme="dark"]{--bg:#0e0e12;--card:#17171d;--tx:#f1f1f4;--mut:#a0a3b1;--bd:#2a2a33;--soft:#22222b}
*{box-sizing:border-box}
html,body{overflow-x:hidden;max-width:100%;overscroll-behavior-x:none}
.layout>*{min-width:0}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:var(--fs);line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
.top{background:var(--top);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--a);gap:10px}
.soc{display:flex;gap:8px;flex-wrap:wrap}.soc a{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:var(--c)}
.soc svg,.chi svg{width:22px;height:22px}.soc img,.chi img{width:100%;height:100%;object-fit:cover}
.sq{width:40px;height:40px;border-radius:10px;background:var(--g);color:#fff;border:0;cursor:pointer;font-size:1.2rem}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.banner{background:var(--bn);border-radius:14px;padding:22px 16px;text-align:center;color:#ffe600;margin-bottom:14px;background-size:cover;background-position:center;min-height:110px;display:flex;flex-direction:column;justify-content:center}
.banner h1{margin:0;font-size:2.1rem;-webkit-text-stroke:1.5px #2a0a20;text-shadow:0 3px 0 #2a0a20}
.banner p{margin:8px auto 0;background:#fff;color:#111;border-radius:8px;padding:2px 14px;font-weight:700;display:inline-block}
.tk{direction:ltr;overflow:hidden;background:var(--g);color:#fff;border-radius:8px;margin-bottom:14px;display:flex;align-items:center}
.tk div{flex:1;overflow:hidden;position:relative;height:38px}
.tk span{position:absolute;left:0;white-space:nowrap;line-height:38px;direction:rtl;unicode-bidi:plaintext;animation:tkm linear infinite;will-change:transform}
.tk b{background:#0004;padding:0 12px;line-height:38px;z-index:1}
@keyframes tkm{from{transform:translateX(-100%)}to{transform:translateX(100vw)}}
.nav{background:var(--g);border-radius:8px;display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:16px;overflow:hidden}
.nav .home{padding:14px 18px;font-weight:700;font-size:1.1rem;white-space:nowrap}
.nav input{flex:1;margin:8px;background:#222;border:0;color:#fff;border-radius:8px;padding:9px 12px;min-width:0}
.layout{display:grid;gap:22px}
#side{display:none}
@media(min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 320px}#side{display:block}#menu{display:none}}
.chips,.shots,.tabs{overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--soft);border-radius:99px;padding:5px 14px;cursor:pointer}
.chip.on{background:var(--g);color:#fff;border-color:transparent}
.sec{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--bd);margin:14px 0 14px}
.sec h2{margin:0;padding-bottom:8px;border-bottom:3px solid var(--a);margin-bottom:-3px;font-size:1.35rem}
.sec select{background:var(--soft);border:0;border-radius:8px;padding:7px 12px;cursor:pointer;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.th{position:relative;aspect-ratio:16/9;background:var(--soft) center/cover;display:grid;place-items:center;font-size:4rem}
.pill{position:absolute;top:10px;right:10px;background:var(--a);color:#fff;border-radius:99px;padding:2px 14px;font-size:.9rem;opacity:.95}
.adm{display:flex;gap:6px;margin-top:4px}.adm button{flex:1;border:1px solid var(--bd);background:var(--soft);border-radius:10px;padding:6px;cursor:pointer}.adm button.d{color:var(--dng)}
.lg{border-top:1px solid var(--bd);padding:8px 0}
.feat{position:absolute;top:10px;left:10px;background:#f59e0b;color:#111;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700}
.cb{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb h3{margin:0;font-size:1.15rem}.meta{color:var(--mut);font-size:.85rem;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.sz{display:inline-flex;align-items:center;gap:5px;background:var(--soft);border-radius:99px;padding:2px 10px 2px 8px;color:var(--tx);font-weight:600}
.sz svg{width:15px;height:15px;fill:var(--a)}
.ex{color:var(--mut);margin:0;flex:1}
.act{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{background:var(--g);color:#fff;border:0;border-radius:99px;padding:10px 22px;cursor:pointer;font-weight:700;text-decoration:none;display:inline-block;text-align:center}
.btn.w{flex:1}.btn.ol{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.dg{background:transparent;color:var(--dng);border:1px solid var(--bd);padding:5px 12px}
.circ{width:44px;height:44px;border-radius:50%;background:var(--g);color:#fff;border:0;cursor:pointer;font-size:1.1rem}
.stars{color:#f59e0b;letter-spacing:2px}.stars i{font-style:normal;cursor:pointer;font-size:1.6rem}
.ad{display:block;margin:14px 0;border:1px dashed var(--bd);border-radius:12px;padding:6px;text-align:center;color:var(--mut);text-decoration:none;font-size:.85rem}
.ad img{max-width:100%;border-radius:8px;display:block;margin:4px auto 0}
.sb{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:16px}
.sb h3{margin:0 0 12px;font-size:1.05rem;padding-bottom:8px;border-bottom:2px solid var(--a)}
.ch{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;margin-bottom:10px;text-decoration:none;color:var(--tx);background:var(--soft);border:1px solid var(--bd);transition:.2s;position:relative;overflow:hidden}
.ch:before{content:"";position:absolute;inset:0 0 0 auto;width:4px;background:var(--c)}
.ch:hover{transform:translateY(-2px);box-shadow:0 6px 16px #0003}
.chi{width:46px;height:46px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:0 3px 8px #0004}
.cht{flex:1;min-width:0}.cht b{display:block;font-size:.98rem}.cht small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{font-size:1.6rem;color:var(--mut)}
.al{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;background:var(--soft);border:1px solid var(--bd);margin-bottom:8px;text-decoration:none;color:var(--tx);position:relative}
.al img{width:54px;height:54px;border-radius:10px;object-fit:cover}.al span{flex:1}.al em{font-style:normal;font-size:.7rem;background:var(--a);color:#fff;border-radius:6px;padding:0 6px;align-self:flex-start}
.mini{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--bd);cursor:pointer}
.mini:first-of-type{border-top:0}.mini i{width:44px;height:44px;border-radius:10px;background:var(--soft) center/cover;display:grid;place-items:center;font-style:normal}
.modal{position:fixed;inset:0;background:#000a;z-index:80;overflow:auto;padding:16px}
.box{background:var(--bg);color:var(--tx);border-radius:18px;max-width:620px;margin:20px auto;padding:18px;position:relative}
.x{position:absolute;top:10px;left:10px;border:0;background:var(--soft);border-radius:50%;width:34px;height:34px;cursor:pointer}
.shots{display:flex;gap:8px;overflow-x:auto;margin:10px 0}.shots img{height:200px;border-radius:10px}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0;text-align:center}.info div{background:var(--soft);border-radius:10px;padding:8px;font-size:.85rem}
.bar{height:10px;background:var(--soft);border-radius:9px;overflow:hidden;margin:10px 0}.bar b{display:block;height:100%;width:0;background:var(--g);transition:width 15s linear}
.hidden{display:none!important}.empty{text-align:center;color:var(--mut);padding:36px 0}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(88vw,350px);background:var(--bg);z-index:45;overflow:auto;padding:16px;transform:translateX(105%);visibility:hidden;transition:transform .25s,visibility .25s;box-shadow:-8px 0 24px #0006}
.drawer.open{transform:none;visibility:visible}#ov{position:fixed;inset:0;background:#0007;z-index:44}
.f{display:grid;gap:8px}.f input,.f textarea,.f select{background:var(--soft);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;width:100%}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.pn{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}.pn h3{margin:0 0 10px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--bd);padding:8px 0}

footer{text-align:center;color:var(--mut);padding:24px 0;font-size:.85rem}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);right:16px;z-index:12;background:var(--g);color:#fff;border:0;border-radius:99px;padding:12px 18px;font-weight:700;box-shadow:0 6px 18px #0005;cursor:pointer}
.lock{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;text-align:center;padding:24px;overflow:auto}
#ldg{z-index:100}.lk{max-width:440px}.lki{font-size:4rem}
.sc{margin-bottom:18px}.sch{display:flex;align-items:center;gap:8px;cursor:pointer;margin:6px 0 10px}.sch h2{margin:0;font-size:1.3rem}.chev{color:var(--a);font-size:2rem;line-height:1}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px;overscroll-behavior-x:contain;touch-action:pan-x pan-y}
.tl{flex:0 0 120px;text-align:center;cursor:pointer;scroll-snap-align:start}
.tli{display:grid;place-items:center;width:120px;height:120px;border-radius:28px;background:var(--soft) center/cover;margin:0 auto 8px;font-size:2.6rem}
.tl b{display:block;font-size:.95rem;line-height:1.3;margin-bottom:2px}
.tl small{color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:.8rem}
.vid{aspect-ratio:16/9;margin:12px 0;border-radius:12px;overflow:hidden;background:#000}.vid iframe{width:100%;height:100%;border:0}
.pick{max-height:200px;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:6px}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;z-index:90;background:#111;color:#fff;border-radius:12px;padding:12px;text-align:center;border:1px solid #555}
.toast.ok{background:#14532d;border-color:#16a34a}
.gear{position:fixed;left:0;top:45%;background:var(--card);border:1px solid var(--bd);border-radius:0 10px 10px 0;width:44px;height:44px;cursor:pointer;z-index:10;font-size:1.3rem}
#admin.full{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 40px}
.fab{padding:0!important;width:56px;height:56px;font-size:1.6rem;display:grid;place-items:center}
.fab.nw:after{content:"";position:absolute;top:2px;right:2px;width:13px;height:13px;border-radius:50%;background:#ef4444;border:2px solid #fff}
.cm{border-top:1px solid var(--bd);padding:10px 0}.cm small{color:var(--mut)}
.rp{background:var(--soft);border-radius:10px;padding:8px;margin:6px 0;margin-inline-end:30px}.rp.me{background:var(--g);color:#fff;margin-inline:30px 0}
</style>
