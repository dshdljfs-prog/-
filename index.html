async function ghPut(path,content,message){

 var br=g.branch||'main',api='https://api.github.com/repos/'+g.repo+'/contents/'+path,H={Authorization:'Bearer '+String(g.token).replace(/[^\x21-\x7E]/g,''),Accept:'application/vnd.github+json'},NE={message:'تعذّر الوصول إلى GitHub: تأكد من الإنترنت، وأوقف أي VPN أو مانع إعلانات على الموقع'};
